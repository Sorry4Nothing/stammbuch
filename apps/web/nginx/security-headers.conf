# Sicherheits-Header für die statische Auslieferung (SR-34, SR-40).
# CSP: nur eigene Quellen. Die API läuft unter derselben Origin (connect-src 'self').
# Wer externe Quellen braucht (Schriften, Bilder), erweitert die CSP gezielt und begründet es im PR.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HSTS wirkt nur über HTTPS. TLS wird vom vorgeschalteten Proxy beendet.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
