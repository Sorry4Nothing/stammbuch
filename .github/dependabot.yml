version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /apps/web
      - /apps/api
      - /apps/worker
    schedule:
      interval: weekly

  # Basis-Image der lokalen Datenbank (postgres in docker-compose.yml)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
